<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
      <header class="text-center pt-5">
        <h1 class="fw-normal">Bootstrap 5 Responsive Grid</h1>
        <p class="text-black-50 fw-lighter">Layout a griglia con diversi breakpoint (sm, md, Ig).</p>
    </header>
    <!-- ./header -->

    <main>
        <section class="container ">
            <div class="row">
                <div class="col-sm-2 bg-light">Colonna 1</div>
                <div class="col bg-secondary text-light">Colonna 2</div>
            </div>
            <div class="row">
                <div class="col bg-primary text-light">Colonna 1</div>
                <div class="col bg-success text-light">Colonna 2</div>
                <div class="col bg-danger text-light">Colonna 3</div>
            </div>
            <div class="row">
                <div class="col bg-info text-light">Colonna 1</div>
                <div class="col bg-warning text-light">Colonna 2</div>
                <div class="col bg-black text-light">Colonna 3</div>
                <div class="col bg-light ">Colonna 4</div>
            </div>
        </section>
        <!-- /.container -->
    </main>
    <!-- ./main -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
